<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FNOL | Call Checklist</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#182538;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:36px 14px}.panel{max-width:760px;margin:auto;background:white;border-radius:18px;box-shadow:0 8px 32px #17263b13;padding:32px}h1{margin:0 0 5px;font-size:28px}.sub{color:#66758a;margin:0 0 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-weight:bold;color:#176a56}.track{height:9px;background:#e8edf2;border-radius:12px;margin:18px 0 25px;overflow:hidden}.fill{height:100%;width:0;background:#149575;transition:width .2s}.item{display:flex;gap:15px;align-items:flex-start;border:1px solid #e5eaf0;border-radius:12px;padding:17px;margin:11px 0;cursor:pointer;line-height:1.5}.item:hover{background:#f7fafc}.item input{width:21px;height:21px;accent-color:#149575;flex:none;margin:1px 0 0}.item:has(input:checked){background:#f0fbf7;border-color:#b5e8d5}.item:has(input:checked) span{text-decoration:line-through;color:#718079}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}button{background:#173d5b;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:bold;cursor:pointer}button:hover{background:#245779}.hint{color:#66758a;font-size:13px}.success{color:#087e5b;font-weight:bold;display:none}@media(max-width:520px){.panel{padding:20px}h1{font-size:23px}body{padding:14px 10px}}
</style></head><body><main class="panel"><div class="top"><div><h1>FNOL Checklist</h1><p class="sub">First Notice of Loss · Customer Service</p></div><div class="count" id="count">0 / 7</div></div><div class="track"><div class="fill" id="fill"></div></div><div id="list"></div><div class="footer"><button type="button" id="reset">↻ Nueva llamada</button><span class="success" id="success">✓ ¡Checklist completado!</span></div><p class="hint">Marca cada paso durante la llamada. Al terminar, presiona «Nueva llamada» o actualiza la página con F5. Las selecciones no se guardan ni se comparten.</p></main><script>
const steps=["Verificar quién es el caller o a quién representa.","Encontrar la póliza correcta para crear el claim (validar al menos 2 datos de la póliza para crear el claim).","Antes de crear el reclamo, repetir el DOL una vez más para confirmar.","Seguir todas las preguntas de Liberate.","Closing Statement: Detallar el claim number, las 48 horas laborables y el email con el subject line.","Mitigar los daños.","Preguntar si tiene alguna duda adicional."];
const list=document.getElementById('list');steps.forEach((step,i)=>{const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.autocomplete='off';input.addEventListener('change',update);const span=document.createElement('span');span.textContent=(i+1)+'. '+step;label.append(input,span);list.append(label)});function update(){const checked=list.querySelectorAll('input:checked').length;document.getElementById('count').textContent=checked+' / '+steps.length;document.getElementById('fill').style.width=(checked/steps.length*100)+'%';document.getElementById('success').style.display=checked===steps.length?'inline':'none'}function reset(){list.querySelectorAll('input').forEach(x=>x.checked=false);update()}document.getElementById('reset').addEventListener('click',reset);window.addEventListener('pageshow',reset);reset();
</script></body></html>
