<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Service | Call Checklists</title><style>body{margin:0;background:#f3f6fb;color:#18263b;font:16px system-ui,Arial,sans-serif}.wrap{max-width:780px;margin:40px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 28px #1b325216}h1{margin:0 0 5px;font-size:27px}.sub{color:#617187;margin:0 0 22px}.tabs{display:flex;gap:10px;margin-bottom:22px}.tabs button{flex:1;padding:13px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-weight:700;cursor:pointer}.tabs button.active{background:#174b87;color:white;border-color:#174b87}.meta{display:flex;justify-content:space-between;font-weight:650;margin:0 0 9px}.track{height:9px;border-radius:20px;background:#e5eaf0;overflow:hidden;margin-bottom:18px}.fill{height:100%;width:0;background:#21936f;transition:width .15s}.task{display:flex;align-items:flex-start;gap:12px;padding:15px 5px;border-bottom:1px solid #edf0f5;cursor:pointer;line-height:1.45}.task input{width:21px;height:21px;flex:none;accent-color:#16825f;margin-top:1px}.task:has(input:checked) span{color:#64748b;text-decoration:line-through}.note{font-size:13px;color:#64748b;margin-top:22px}.done{color:#137b5d;font-weight:700;margin-top:15px}.reset{margin-top:18px;padding:11px 16px;background:#174b87;border:0;color:white;border-radius:9px;cursor:pointer;font-weight:650}@media(max-width:480px){.wrap{margin:18px auto}.card{padding:20px}h1{font-size:23px}}</style></head><body><main class="wrap"><div class="card"><h1>Customer Service — Call Checklists</h1><p class="sub">Recordatorio de procedimientos durante cada llamada</p><nav class="tabs"><button id="fnolTab" class="active" type="button">FNOL</button><button id="statusTab" type="button">Status Call</button></nav><div class="meta"><span id="heading">FNOL Checklist</span><span id="counter">0/7</span></div><div class="track"><div class="fill" id="progress"></div></div><div id="tasks"></div><div id="complete" class="done" hidden>✓ ¡Todos los procedimientos completados!</div><button class="reset" id="reset" type="button">Nueva llamada · Desmarcar todo</button><p class="note">Cada agente usa sus propias casillas. Presiona F5 para iniciar una nueva llamada. No ingreses información de clientes en esta página.</p></div></main><script>const lists={fnol:["Verificar quién es el caller o a quién representa.","Encontrar la póliza correcta para crear el claim (validar al menos 2 datos de la póliza).","Antes de crear el reclamo, repetir el DOL una vez más para confirmar.","Seguir todas las preguntas de Liberate.","Closing Statement: Detallar el Claim Number, las 48 horas laborables y el email con el Subject Line.","Mitigar los daños.","Preguntar si tiene alguna duda adicional."],status:["Verificar al caller según Ally, realizando las preguntas de validación correspondientes. Recordar que cada tipo de caller requiere una validación diferente.","Identificar la relación del caller con las partes involucradas y comprender el motivo de la llamada.","Realizar el Loyalty Statement correspondiente al tipo de caller.","REVISAR obligatoriamente el cuadro de Contact Update Guidelines y VERIFICAR que toda la información esté correcta y actualizada.","Si corresponde transferir la llamada, seguir siempre el speech de VM: Name, Claim Number, Phone Number y motivo de la llamada.","Preguntar siempre si tiene alguna duda adicional.","Realizar el Loyalty Statement de cierre."]};let type='fnol';const checked={fnol:new Set(),status:new Set()};function render(){document.getElementById('fnolTab').classList.toggle('active',type==='fnol');document.getElementById('statusTab').classList.toggle('active',type==='status');document.getElementById('heading').textContent=type==='fnol'?'FNOL Checklist':'Status Call Checklist';const root=document.getElementById('tasks');root.replaceChildren();lists[type].forEach((t,i)=>{const label=document.createElement('label');label.className='task';const input=document.createElement('input');input.type='checkbox';input.checked=checked[type].has(i);input.addEventListener('change',()=>{input.checked?checked[type].add(i):checked[type].delete(i);update()});const span=document.createElement('span');span.textContent=t;label.append(input,span);root.append(label)});update()}function update(){const n=checked[type].size;document.getElementById('counter').textContent=n+'/'+lists[type].length;document.getElementById('progress').style.width=(100*n/lists[type].length)+'%';document.getElementById('complete').hidden=n!==lists[type].length}document.getElementById('fnolTab').onclick=()=>{type='fnol';render()};document.getElementById('statusTab').onclick=()=>{type='status';render()};document.getElementById('reset').onclick=()=>{checked[type].clear();render()};render();</script></body></html>
